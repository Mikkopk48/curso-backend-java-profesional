<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>FintechLab didáctico</title>
<style>body{font-family:system-ui;max-width:760px;margin:2rem auto;padding:0 1rem;color:#18212b}form{display:grid;gap:.7rem}input,button{font:inherit;padding:.65rem}button{background:#1456c0;color:white;border:0;border-radius:.4rem}pre{background:#f3f5f7;padding:1rem;overflow:auto}.warning{border-left:4px solid #cf7a00;padding:.7rem}</style></head>
<body><h1>FintechLab</h1><p class="warning">Interfaz didáctica. Usa solo UUID y dinero ficticios.</p>
<form id="transfer-form"><label>Cuenta origen <input id="origin" required></label><label>Cuenta destino <input id="destination" required></label><label>Importe <input id="amount" type="number" min="0.01" step="0.01" required></label><label>Moneda <input id="currency" value="ARS" pattern="[A-Z]{3}" required></label><button data-testid="transfer-submit">Transferir</button></form><p role="status" aria-live="polite"></p><pre id="output"></pre>
<script>document.querySelector('#transfer-form').addEventListener('submit',async e=>{e.preventDefault();const status=document.querySelector('[role=status]');status.textContent='Procesando';const body={originAccountId:origin.value,destinationAccountId:destination.value,amount:Number(amount.value).toFixed(2),currency:currency.value};try{const response=await fetch('/api/transfers',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify(body)});const data=await response.json();output.textContent=JSON.stringify(data,null,2);status.textContent=response.ok?'Transferencia registrada':'Transferencia rechazada';}catch(error){status.textContent='Servicio no disponible';output.textContent=error.message;}});</script></body></html>
