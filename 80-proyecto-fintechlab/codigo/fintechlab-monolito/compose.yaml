services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: fintechlab
      MYSQL_USER: fintech
      MYSQL_PASSWORD: local_dev_only
      MYSQL_ROOT_PASSWORD: root_local_dev_only
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_local_dev_only"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: ["fintechlab_mysql:/var/lib/mysql"]
volumes:
  fintechlab_mysql:
